---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hello-world-httproute
spec:
  hostnames:
  - <YOUR_NAME>.<YOUR_DOMAIN>
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: gateway
    namespace: guida-gateway-training
    sectionName: http
  rules:
  - backendRefs:
    - group: ""
      kind: Service
      name: hello-world-service
      port: 8080
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /
