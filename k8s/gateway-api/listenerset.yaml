---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: hello-world
spec:
  parentRef:
    name: gateway
    namespace: guida-gateway-training
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: <YOUR_NAME>.<YOUR_DOMAIN>
      allowedRoutes:
        namespaces:
          from: Same
